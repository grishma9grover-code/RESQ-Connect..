
<html>
<head>
    <title>ResQ Connect - Signup</title>

    <style>
        body {
            background-image: url("Rescue Watch Over the Sunset Valley.png");
            background-size: cover;
            background-position: center;
        }

        .box {
            width: 400px;
            height: 440px;
            background: rgba(7, 30, 58, 0.82);
            position: absolute;
            right: 350px;
            top: 100px;
            text-align: center;
        }

        input {
            padding: 5px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h2 style="color:white;">Create your account</h2>
        <p style="color:white;">Locate-Connect-Save</p>

        <form id="signupForm">

            <label style="color:white;">Name</label>
            <input type="text" id="name"
                   placeholder="Enter your name" required>

            <br><br>

            <label style="color:white;">Email</label>
            <input type="email" id="email"
                   placeholder="Enter your email" required>

            <br><br>

            <label style="color:white;">Mobile No</label>
            <input type="tel" id="mobile"
                   placeholder="Enter your Phone no." required>

            <br><br>

            <label style="color:white;">Set Password</label>
            <input type="password" id="password"
                   placeholder="Set your password"
                   minlength="8" maxlength="15" required>

            <br><br>

            <button type="submit"
                style="background-color:red; color:white; padding:10px 130px; border:none; cursor:pointer;">
                Signup
            </button>

            <br><br>

            <hr>

            <b>
                <p style="color:white;">
                    Or<br>Already have an account?
                </p>
                <a href="Login.html">Login</a>
            </b>

        </form>

    </div>

    <script src="connect.js"></script>

    <script>
        document.getElementById("signupForm").addEventListener("submit", function(event) {

            event.preventDefault();

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim().toLowerCase();
            let mobile = document.getElementById("mobile").value.trim();
            let password = document.getElementById("password").value;

            if (password.length < 8 || password.length > 15) {
                alert("Password must be between 8 and 15 characters.");
                return;
            }

            let pendingSignup = {
                name: name,
                email: email,
                mobile: mobile,
                password: password
            };

            sessionStorage.setItem(
                "pendingSignup",
                JSON.stringify(pendingSignup)
            );

            window.location.href = "role.html";

        });
    </script>

</body>
</html>

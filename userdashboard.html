<!DOCTYPE html>
<html>
<head>
    <title>ResQ Connect Dashboard</title>
</head>

<body style="margin:0; font-family:Arial; background:whitesmoke;">

    <!-- HEADER -->
    <div style="background:#102a43; color:white; padding:20px;">
       
    </div>


    <!-- MAIN CONTAINER -->
    <div style="display:flex;">

        <!-- SIDEBAR -->
        <div style="width:200px; background:#163b5c; color:white; min-height:600px; padding:20px;">

            <h2>Menu</h2>

          <button style="width:100%;  padding:15px;  margin-bottom:10px;  background:#163b5c; color:white;  border:none;  text-align:left;  font-size:16px;  cursor:pointer;"> 🏠 Dashboard</button>
          <br>
         <button style="width:100%;  padding:15px;  margin-bottom:10px;  background:#163b5c; color:white;  border:none;  text-align:left;  font-size:16px;  cursor:pointer;">🚨 Report Emergency</button>
           <br>
          <button style="width:100%;  padding:15px;  margin-bottom:10px;  background:#163b5c; color:white;  border:none;  text-align:left;  font-size:16px;  cursor:pointer;">👥 Rescue Teams</button>
            <br>
        <button style="width:100%;  padding:15px;  margin-bottom:10px;  background:#163b5c; color:white;  border:none;  text-align:left;  font-size:16px;  cursor:pointer;">📍 Incidents</button>
        <br>
            <button style="width:100%;  padding:15px;  margin-bottom:10px;  background:#163b5c; color:white;  border:none;  text-align:left;  font-size:16px;  cursor:pointer;">📦 Resources</button>
            <button style="width:100%;  padding:15px;  margin-bottom:10px;  background:#163b5c; color:white;  border:none;  text-align:left;  font-size:16px;  cursor:pointer;">💬 Messages</button>
             <button style="width:100%;  padding:15px;  margin-bottom:10px;  background:#163b5c; color:white;  border:none;  text-align:left;  font-size:16px;  cursor:pointer;">⚙️ Settings</button>

        </div>


        <!-- DASHBOARD CONTENT -->
        <div style="padding:30px; flex:1;">

         


            <!-- STATISTICS BOXES -->
            <div style="display:flex; gap:20px;">

                <div style="background:white; padding:20px; width:200px; border-radius:10px;">
                    
                </div>

                <div style="background:white; padding:20px; width:200px; border-radius:10px;">
                  
                </div>

                <div style="background:white; padding:20px; width:200px; border-radius:10px;">
                   
                </div>

                <div style="background:white; padding:20px; width:200px; border-radius:10px;">
                   
                </div>

            </div>


            <!-- LOWER SECTION -->
            <div style="display:flex; gap:20px; margin-top:30px;">

                <!-- MAP BOX -->
                <div style="background:white; padding:20px; width:60%; height:300px; border-radius:10px;">

                   

                    <div style="background:#dce6d5; height:220px; display:flex; align-items:center; justify-content:center;">
                        MAP AREA
                    </div>

                </div>


                <!-- RECENT INCIDENTS -->
                <div style="background:white; padding:20px; width:30%; border-radius:10px;">

                    
                </div>

            </div>


            <!-- QUICK ACTIONS -->
            <div style="background:white; padding:20px; margin-top:30px; border-radius:10px;">

                <h2>Quick Actions</h2>

                <button style="padding:12px; margin:5px;">
                    Report Emergency
                </button>

                <button style="padding:12px; margin:5px;">
                    View Rescue Teams
                </button>

                <button style="padding:12px; margin:5px;">
                    Track Incidents
                </button>

                <button style="padding:12px; margin:5px;">
                    Request Resources
                </button>

            </div>


        
            <div style="background:white; padding:20px; margin-top:30px; border-radius:10px;">


            </div>

        </div>

    </div>

</body>
</html>
